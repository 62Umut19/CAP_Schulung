_schema-version: '3.1'
ID: cap-schulung-aldinord
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: cap-schulung-aldinord-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: cap-schulung-aldinord-destination
      - name: cap-schulung-aldinord-db
      - name: cap-schulung-aldinord-auth

  - name: cap-schulung-aldinord-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: cap-schulung-aldinord-db

  - name: cap-schulung-aldinord
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: cap-schulung-aldinord-auth
      - name: ui5-standalone-html5repo-runtime


  - name: ui5app
    type: html5
    path: app/inventory
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run buildui5
      supported-platforms: []


  - name: html5-deployer
    type: com.sap.application.content
    path: app/inventory
    requires:
      - name: ui5-shared-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - ui5app.zip
          name: ui5app
          target-path: resources/


resources:
  - name: ui5-shared-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-key:
        name: ui5-shared-repo-host-key
  - name: ui5-standalone-html5repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: cap-schulung-aldinord-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: cap-schulung-aldinord-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: cap-schulung-aldinord-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cap-schulung-aldinord-${org}-${space}
        tenant-mode: dedicated
